seed: 42
output_dir: outputs/krea2-edit-r64-t0-arcface-1008x672
resume_from: null
init_adapter: weights/r64-from-r256-step500.safetensors

model:
  krea_code_path: vendor/krea-2
  checkpoint: /home/alissonerdx/.cache/huggingface/hub/models--krea--Krea-2-Raw/snapshots/b2e772263cfa934848fde713159d1553e086778c/raw.safetensors
  text_encoder: Qwen/Qwen3-VL-4B-Instruct
  vae: Qwen/Qwen-Image
  dtype: bf16
  gradient_checkpointing: true
  quantization: int8
  component_offload: true

edit_conditioning:
  # shared reproduces the original node; zero protects clean reference tokens
  # from the target noise timestep; blend interpolates between both behaviors.
  reference_timestep: zero
  reference_timestep_blend: 1.0

data:
  train_manifest: ../dataset/train.jsonl
  validation_manifest: ../dataset/validation.jsonl
  cache_dir: ../dataset/cache-krea2-edit-1008x672
  width: 1008
  height: 672
  batch_size: 1
  num_workers: 2
  max_controls: 1
  reference_geometry: anchor
  grounding_max_pixels: 1048576
  instruction_dropout: 0.10

identity_loss:
  enabled: true
  cache_dir: ../dataset/cache-identity-1008x672
  weight: 0.05
  every_n_steps: 8
  start_step: 0
  max_t: 0.8
  offload_after: false
  latent_crop: true
  crop_padding_pixels: 128
  crop_minimum_latent_size: 32
  vae_tiling: false
  vae_tile_size: 512
  weights: null

lora:
  rank: 64
  alpha: 64
  dropout: 0.0
  all_linear: false
  # Full edit topology: DiT attention/MLP plus text-fusion attention/MLP.
  module_patterns: ["re:^(blocks\\.\\d+|txtfusion\\.(layerwise_blocks|refiner_blocks)\\.\\d+)\\.(attn\\.(wq|wk|wv|wo|gate)|mlp\\.(gate|up|down))$"]

optimizer:
  name: adamw8bit
  lr: 5.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.99]
  eps: 1.0e-8
  decouple: true
  d_coef: 1.0

scheduler:
  name: cosine
  warmup_steps: 25
  min_lr: 1.0e-5

train:
  max_steps: 3000
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_optimizer: false
  save_every: 250
  sample_every: 250
  sample_count: 2
  log_every: 5

sampling:
  # Krea 2 Raw reference sampling: 52 steps, CFG 3.5.
  steps: 52
  guidance: 3.5
  min_res: 256
  max_res: 1024
  y1: 0.5
  y2: 1.15
  mu: null

wandb:
  enabled: true
  project: krea2-edit-lora
  entity: null
  run_name: krea2-edit-r64-t0-arcface-1008x672
