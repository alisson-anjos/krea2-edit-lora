seed: 42
output_dir: outputs/krea2-edit-v12-sheet-shared-1008x672
resume_from: null
# Preserve the published identity/edit prior instead of learning the edit path from zero.
init_adapter: weights/krea2_identity_edit_v1_2.safetensors

model:
  krea_code_path: vendor/krea-2
  checkpoint: /home/alissonerdx/.cache/huggingface/hub/models--krea--Krea-2-Raw/snapshots/b2e772263cfa934848fde713159d1553e086778c/raw.safetensors
  text_encoder: Qwen/Qwen3-VL-4B-Instruct
  vae: Qwen/Qwen-Image
  dtype: bf16
  gradient_checkpointing: true
  quantization: int8
  component_offload: true

edit_conditioning:
  # Match the published v1.2 training/inference path.
  reference_timestep: shared
  reference_timestep_blend: 0.0

data:
  train_manifest: ../dataset/train.jsonl
  validation_manifest: ../dataset/validation.jsonl
  cache_dir: ../dataset/cache-krea2-edit-1008x672
  width: 1008
  height: 672
  batch_size: 1
  num_workers: 2
  max_controls: 1
  # All pairs and the output are exactly 3:2, making this pixel-identical to v1.2 fit.
  reference_geometry: anchor
  grounding_max_pixels: 1048576
  instruction_dropout: 0.10

identity_loss:
  # ArcFace overfit training identities and did not improve held-out appearance.
  enabled: false

lora:
  # Exact topology and rank of krea2_identity_edit_v1_2.safetensors.
  rank: 256
  alpha: 256
  dropout: 0.0
  all_linear: false
  module_patterns: ["re:^(blocks\\.\\d+|txtfusion\\.(layerwise_blocks|refiner_blocks)\\.\\d+)\\.(attn\\.(wq|wk|wv|wo|gate)|mlp\\.(gate|up|down))$"]

optimizer:
  name: adamw8bit
  # Low LR limits catastrophic forgetting of the v1.2 identity prior.
  lr: 5.0e-6
  weight_decay: 0.01
  betas: [0.9, 0.99]
  eps: 1.0e-8
  decouple: true
  d_coef: 1.0

scheduler:
  name: cosine
  warmup_steps: 20
  min_lr: 1.0e-6

train:
  # Roughly two passes over 199 pairs; inspect every 50 before extending.
  max_steps: 400
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_optimizer: false
  save_every: 50
  sample_every: 50
  sample_count: 2
  log_every: 5

sampling:
  steps: 20
  guidance: 3.0
  reference_attention_boost: 4.0
  min_res: 256
  max_res: 1024
  y1: 0.5
  y2: 1.15
  mu: null

wandb:
  enabled: true
  project: krea2-edit-lora
  entity: null
  run_name: krea2-edit-v12-sheet-shared-1008x672
