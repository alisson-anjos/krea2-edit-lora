seed: 42
output_dir: outputs/krea2-edit-headswap512-lora-r256
resume_from: null
# STAGE 2: add head-swap on top of the tiny OmniEdit base (warm-start, fresh step/optimizer)
init_adapter: outputs/krea2-edit-tiny512-lora-r256/checkpoint-0004000/adapter.safetensors

model:
  krea_code_path: vendor/krea-2
  checkpoint: models/Krea-2-Raw/raw.safetensors
  text_encoder: models/Qwen3-VL-4B-Instruct
  vae: models/Qwen-Image
  dtype: bf16
  gradient_checkpointing: true
  quantization: none
  component_offload: false

edit_conditioning:
  reference_timestep: shared
  reference_timestep_blend: 0.0

data:
  local_manifest: /data/datasets/drive_dataset/manifest.jsonl
  local_base_dir: /data/datasets/drive_dataset
  local_control_cols: ["guide", "reference"]   # Picture 1 = body/base (frame 1), Picture 2 = face/head (frame 2)
  local_target_col: target
  local_caption_col: instruction
  local_val_holdout: 6
  cache_dir: null
  width: 512
  height: 512
  target_aspect_buckets: true
  bucket_base_resolution: 512
  bucket_step: 16
  batch_size: 1
  num_workers: 4
  max_controls: 2
  reference_geometry: fit
  grounding_mode: images
  grounding_max_pixels: 0
  grounding_max_side: 512
  instruction_dropout: 0.05
  grounding_vision_dropout: 0.0     # always ground both refs (which is which matters for head-swap)
  grounding_ref_labels: false       # no labels -> compatible with the standard comfyui-krea2edit node (2-ref, ordered)

identity_loss:
  enabled: false

lora:
  rank: 256
  alpha: 256
  dropout: 0.0
  all_linear: false
  module_patterns: ["re:^(blocks\\.\\d+|txtfusion\\.(layerwise_blocks|refiner_blocks)\\.\\d+)\\.(attn\\.(wq|wk|wv|wo|gate)|mlp\\.(gate|up|down))$"]

optimizer:
  name: adamw8bit
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.99]
  eps: 1.0e-8
  decouple: true
  d_coef: 1.0

scheduler:
  name: constant

train:
  mode: lora
  minimum_vram_gib: 30
  max_steps: 3000
  timestep_type: sigmoid
  timestep_shift: 0.0
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_optimizer: false
  save_optimizer: false
  save_every: 500
  keep_last_checkpoints: 2
  sample_every: 100
  sample_at_start: true
  sample_count: 6
  log_every: 10

sampling:
  steps: 20
  guidance: 3.0
  reference_attention_boost: 1.0
  min_res: 256
  max_res: 512
  y1: 0.5
  y2: 1.15
  mu: null

wandb:
  enabled: true
  project: krea2-edit-lora
  entity: null
  run_name: krea2-edit-headswap512-lora-r256
