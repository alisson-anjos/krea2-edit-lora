seed: 42
output_dir: outputs/krea2-edit-headswap-r256-shared-672x1024
resume_from: null
init_adapter: null

model:
  krea_code_path: vendor/krea-2
  checkpoint: /home/alissonerdx/.cache/huggingface/hub/models--krea--Krea-2-Raw/snapshots/b2e772263cfa934848fde713159d1553e086778c/raw.safetensors
  text_encoder: Qwen/Qwen3-VL-4B-Instruct
  vae: Qwen/Qwen-Image
  dtype: bf16
  gradient_checkpointing: true
  quantization: int8
  component_offload: true

edit_conditioning:
  # Reproduce the original successful conditioning path: no t=0 modulation.
  reference_timestep: shared
  reference_timestep_blend: 0.0

data:
  train_manifest: ../dataset/head_swap/train_portrait.jsonl
  validation_manifest: ../dataset/head_swap/validation_portrait.jsonl
  cache_dir: ../dataset/head_swap/cache-krea2-edit-672x1024-portrait
  width: 672
  height: 1024
  batch_size: 1
  num_workers: 2
  # Ordered RoPE frames: body=1, face=2, target=0.
  max_controls: 2
  reference_geometry: anchor
  grounding_max_pixels: 1048576
  instruction_dropout: 0.10

identity_loss:
  enabled: false

lora:
  rank: 256
  alpha: 256
  dropout: 0.0
  all_linear: false
  module_patterns: ["re:^(blocks\\.\\d+|txtfusion\\.(layerwise_blocks|refiner_blocks)\\.\\d+)\\.(attn\\.(wq|wk|wv|wo|gate)|mlp\\.(gate|up|down))$"]

optimizer:
  name: adamw8bit
  # Phase 1 of the original strategy: learn the new edit topology from zero.
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.99]
  eps: 1.0e-8
  decouple: true
  d_coef: 1.0

scheduler:
  name: cosine
  warmup_steps: 25
  min_lr: 2.0e-5

train:
  # About 2.5 passes over the 202-pair portrait subset.
  max_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_optimizer: false
  save_every: 100
  sample_every: 100
  sample_count: 2
  log_every: 5

sampling:
  # Shorter validation for the topology test; training forward is unchanged.
  steps: 20
  guidance: 3.0
  min_res: 256
  max_res: 1024
  y1: 0.5
  y2: 1.15
  mu: null

wandb:
  enabled: true
  project: krea2-edit-lora
  entity: null
  run_name: krea2-edit-headswap-r256-shared-672x1024
