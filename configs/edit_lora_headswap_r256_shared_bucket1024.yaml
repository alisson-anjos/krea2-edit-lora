seed: 42
output_dir: outputs/krea2-edit-headswap-r256-shared-bucket1024
resume_from: null
init_adapter: null

model:
  krea_code_path: vendor/krea-2
  checkpoint: /home/alissonerdx/.cache/huggingface/hub/models--krea--Krea-2-Raw/snapshots/b2e772263cfa934848fde713159d1553e086778c/raw.safetensors
  text_encoder: Qwen/Qwen3-VL-4B-Instruct
  vae: Qwen/Qwen-Image
  dtype: bf16
  gradient_checkpointing: true
  quantization: int8
  component_offload: true

edit_conditioning:
  # Same conditioning used by the first successful run: controls share target t.
  reference_timestep: shared
  reference_timestep_blend: 0.0

data:
  train_manifest: ../dataset/head_swap/train.jsonl
  validation_manifest: ../dataset/head_swap/validation.jsonl
  cache_dir: /mnt/c/krea-cache/headswap-krea2-edit-bucket1024-text-only
  # Qwen sees only the instruction. Body/face appearance can enter only through VAE refs.
  grounding_mode: text_only
  cache_text_quantization: none
  # At ~one epoch, a stable 10% subset avoids storing a duplicate blank context for every item.
  cache_fixed_instruction_dropout: true
  # Width/height remain the nominal base. Each sample gets a target-AR ~1 MP bucket.
  width: 1024
  height: 1024
  target_aspect_buckets: true
  bucket_base_resolution: 1024
  bucket_step: 16
  batch_size: 1
  num_workers: 2
  max_controls: 2
  # Picture 1/body fills the target bucket; Picture 2/face is fitted without cropping.
  reference_geometry: fit
  grounding_max_pixels: 1048576
  instruction_dropout: 0.10

identity_loss:
  enabled: false

lora:
  rank: 256
  alpha: 256
  dropout: 0.0
  all_linear: false
  module_patterns: ["re:^(blocks\\.\\d+|txtfusion\\.(layerwise_blocks|refiner_blocks)\\.\\d+)\\.(attn\\.(wq|wk|wv|wo|gate)|mlp\\.(gate|up|down))$"]

optimizer:
  name: adamw8bit
  # Phase 1 mirrors the original run: learn the edit topology from random LoRA.
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.99]
  eps: 1.0e-8
  decouple: true
  d_coef: 1.0

scheduler:
  name: cosine
  warmup_steps: 25
  min_lr: 2.0e-5

train:
  max_steps: 500
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_optimizer: false
  save_every: 100
  sample_every: 100
  sample_count: 2
  log_every: 5

sampling:
  steps: 20
  guidance: 3.0
  min_res: 256
  max_res: 1024
  y1: 0.5
  y2: 1.15
  mu: null

wandb:
  enabled: true
  project: krea2-edit-lora
  entity: null
  run_name: krea2-edit-headswap-r256-shared-bucket1024
