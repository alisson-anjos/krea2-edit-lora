seed: 42
output_dir: outputs/krea2-edit-headswap-v11-curated-grounded768
resume_from: null
init_adapter: /home/alissonerdx/.cache/huggingface/hub/models--conradlocke--krea2-identity-edit/snapshots/2686ea3601417448f9649f6e74ca7103d446da96/krea2_identity_edit_v1_1.safetensors

model:
  krea_code_path: vendor/krea-2
  checkpoint: /home/alissonerdx/.cache/huggingface/hub/models--krea--Krea-2-Raw/snapshots/b2e772263cfa934848fde713159d1553e086778c/raw.safetensors
  text_encoder: Qwen/Qwen3-VL-4B-Instruct
  vae: Qwen/Qwen-Image
  dtype: bf16
  gradient_checkpointing: true
  quantization: int8
  component_offload: true

edit_conditioning:
  # Matches the public Identity Edit forward, not Ostris's t=0 adapter.
  reference_timestep: shared
  reference_timestep_blend: 0.0

data:
  # 23 train + 5 held-out triples that preserve the source and transfer identity.
  train_manifest: ../dataset/head_swap/train_curated.jsonl
  validation_manifest: ../dataset/head_swap/validation_curated.jsonl
  cache_dir: /mnt/c/krea-cache/headswap-krea2-v11-curated-grounded768
  grounding_mode: images
  cache_text_quantization: none
  cache_fixed_instruction_dropout: true
  width: 1024
  height: 1024
  target_aspect_buckets: true
  bucket_base_resolution: 1024
  bucket_step: 16
  batch_size: 1
  num_workers: 2
  max_controls: 2
  reference_geometry: fit
  # The official v1.2 range is 384-768 on the longest side. Use the exact upper
  # endpoint for this controlled run; appearance detail still enters via VAE.
  grounding_max_pixels: 0
  grounding_max_side: 768
  instruction_dropout: 0.10

identity_loss:
  enabled: false

lora:
  rank: 256
  alpha: 256
  dropout: 0.0
  all_linear: false
  # Exactly the 256 modules / 512 tensors present in the released v1.1 adapter.
  module_patterns: ["re:^(blocks\\.\\d+|txtfusion\\.(layerwise_blocks|refiner_blocks)\\.\\d+)\\.(attn\\.(wq|wk|wv|wo|gate)|mlp\\.(gate|up|down))$"]

optimizer:
  name: adamw8bit
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.99]
  eps: 1.0e-8
  decouple: true
  d_coef: 1.0

scheduler:
  name: constant

train:
  max_steps: 300
  timestep_type: sigmoid
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_optimizer: false
  save_every: 30
  sample_every: 30
  sample_at_start: true
  sample_count: 4
  log_every: 5

sampling:
  steps: 20
  guidance: 3.0
  min_res: 256
  max_res: 1024
  y1: 0.5
  y2: 1.15
  mu: null

wandb:
  enabled: true
  project: krea2-edit-lora
  entity: null
  run_name: krea2-edit-headswap-v11-curated-grounded768
