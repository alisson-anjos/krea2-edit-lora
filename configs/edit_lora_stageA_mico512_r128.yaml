seed: 42
output_dir: outputs/krea2-edit-stageA-mico512-r128
resume_from: null
# STAGE A: teach the model that reference frame 2 carries content, on an easy two-reference
# edit task, BEFORE asking for a head swap (identity from a non-aligned second reference).
init_adapter: weights/tiny512-r128.safetensors

model:
  krea_code_path: vendor/krea-2
  checkpoint: models/Krea-2-Raw/raw.safetensors
  text_encoder: models/Qwen3-VL-4B-Instruct
  vae: models/Qwen-Image
  dtype: bf16
  gradient_checkpointing: true
  quantization: none
  component_offload: false

edit_conditioning:
  reference_timestep: shared
  reference_timestep_blend: 0.0

data:
  # MIXED manifest = head-swap (guide+reference, 2-ref) + tiny OmniEdit edits (source, 1-ref).
  # Replaying the edit samples alongside head-swap keeps the general-editing knowledge (no forgetting).
  local_manifest: /data/datasets/stageA_mico_manifest.jsonl
  local_control_cols: ["guide", "reference", "source"]   # per-row: head-swap uses guide(frame1)+reference(frame2); edit uses source(frame1)
  local_target_col: target
  local_caption_col: instruction
  local_val_holdout: 6
  cache_dir: null
  width: 512
  height: 512
  target_aspect_buckets: true
  bucket_base_resolution: 512
  bucket_step: 16
  batch_size: 1
  num_workers: 4
  max_controls: 2
  # fit = AR-preserving, byte-identical to comfyui-krea2edit v1.2.5's DEFAULT fit_mode: no stretch
  # (the 512 run's bug -- a squashed face is a different face), near-matched-AR minimal center-crop
  # (reference_fit_crop_tol) and the v1.2.4 crop-to-grid fix, so the LoRA runs on stock nodes with
  # no fork. `pad` (+ reference_pad_color) is the alternative: same-size references, but it needs
  # our forked node's fit_mode="pad" and spends ~25% of the reference tokens on flat padding.
  reference_geometry: fit
  reference_fit_crop_tol: 0.08
  local_align_first_control: false   # control 0 (body) gets the same geometry as the face ref
  grounding_mode: images
  grounding_max_pixels: 0
  grounding_max_side: 1024          # cap fed to Qwen3-VL
  grounding_jitter_min: 384         # per-step cap ~ uniform[384, 1024]: scale robustness, so
                                    # inference may ground at any resolution (recipe requires it)
  grounding_native_max_side: 1024   # the VLM sees the reference in its OWN framing, pre-fit
  instruction_dropout: 0.05
  grounding_vision_dropout: 0.0     # always ground both refs (which is which matters for head-swap)
  grounding_ref_labels: false       # no labels -> compatible with the standard comfyui-krea2edit node (2-ref, ordered)

identity_loss:
  enabled: false

lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  all_linear: false
  module_patterns: ["re:^(blocks\\.\\d+|txtfusion\\.(layerwise_blocks|refiner_blocks)\\.\\d+)\\.(attn\\.(wq|wk|wv|wo|gate)|mlp\\.(gate|up|down))$"]

optimizer:
  name: adamw8bit
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.99]
  eps: 1.0e-8
  decouple: true
  d_coef: 1.0

scheduler:
  name: constant

train:
  mode: lora
  minimum_vram_gib: 30
  max_steps: 1200
  timestep_type: weighted    # uniform sampling + per-timestep loss weights (krea2edit-trainer recipe)
  timestep_shift: 0.0
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  resume_optimizer: false
  save_optimizer: false
  save_every: 300
  keep_last_checkpoints: 2
  sample_every: 200
  sample_at_start: true
  sample_count: 6
  log_every: 10

sampling:
  steps: 20
  guidance: 3.0
  reference_attention_boost: 1.0
  min_res: 256
  max_res: 512
  y1: 0.5
  y2: 1.15
  mu: null

wandb:
  enabled: true
  project: krea2-edit-lora
  entity: null
  run_name: krea2-edit-stageA-mico512-r128
