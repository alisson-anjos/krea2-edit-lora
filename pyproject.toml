[project]
name = "krea2-edit-lora"
version = "0.2.0"
description = "Standalone in-context image-edit LoRA training for Krea 2 Raw"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate>=1.8",
  "adan-pytorch>=0.0.5",
  "bitsandbytes==0.48.2",
  "diffusers>=0.32",
  "datasets>=4.0",
  "einops>=0.8",
  "huggingface-hub>=0.30",
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pillow>=10",
  "prodigyopt>=1.1",
  "safetensors>=0.5",
  "torch>=2.7",
  "torchao>=0.16",
  "torchvision>=0.26",
  "transformers==4.57.1",
  "wandb>=0.19",
]

[project.optional-dependencies]
identity-cache = ["opencv-python-headless>=4.11,<5"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
